services:
  spark-master:
    image: apache/spark:4.0.1
    container_name: chainsentinel-spark-master
    hostname: spark-master
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../../data:/opt/spark-data
      - ../hadoop/config/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ../hadoop/config/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
    networks:
      - hadoop_default
    restart: unless-stopped

  spark-worker:
    image: apache/spark:4.0.1
    container_name: chainsentinel-spark-worker
    hostname: spark-worker
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ../../data:/opt/spark-data
      - ../hadoop/config/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ../hadoop/config/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
    networks:
      - hadoop_default
    restart: unless-stopped

networks:
  hadoop_default:
    external: true
